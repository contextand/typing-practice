name: Rebuild from Sanity

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-from-sanity
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python3 build.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html book/index.html
          git diff --quiet --cached || git commit -m "chore: auto-rebuild from Sanity"
          git pull --rebase origin main
          git push
