<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타이핑 CMS</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'contextand/typing-practice',
          branch: 'main',
          base_url: 'https://typing-practice-lemon.vercel.app',
          auth_endpoint: '/api/auth',
        },
        locale: 'ko',
        media_folder: 'admin/uploads',
        collections: [
          {
            name: 'books',
            label: '책',
            label_singular: '책',
            folder: 'data/책',
            create: true,
            slug: '{{title}}',
            format: 'frontmatter',
            fields: [
              { label: '제목', name: 'title', widget: 'string' },
              { label: '글쓴이', name: 'author', widget: 'string', required: false },
              { label: '장르', name: 'genre', widget: 'string', required: false },
              { label: '출판사', name: 'publisher', widget: 'string', required: false },
              { label: '정리한 날', name: 'date', widget: 'string', required: false, hint: '예: 2025년 1월 1일' },
              {
                label: '발췌문',
                name: 'body',
                widget: 'text',
                hint: '페이지 번호와 발췌문을 번갈아 입력하세요.\n\n예:\n12\n\n여기에 발췌문 내용\n\n15\n\n다음 발췌문 내용',
              },
            ],
          },
        ],
      },
    });
  </script>
</body>
</html>
